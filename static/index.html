<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { color: #333; }
    #chatbox { border: 1px solid #ccc; background: white; padding: 10px; height: 400px; overflow-y: auto; margin-bottom: 10px; }
    .msg { margin: 5px 0; padding: 8px; border-radius: 5px; }
    .user { background: #d1e7dd; text-align: right; }
    .bot { background: #f8d7da; text-align: left; }
    input, button { padding: 8px; }
  </style>
</head>
<body>
  <h1>RAG Chatbot (Gemini + FAISS)</h1>
  <div id="chatbox"></div>
  <input type="text" id="query" placeholder="Ask something..." size="50"/>
  <button onclick="sendQuery()">Send</button>

  <script>
    async function sendQuery() {
      const query = document.getElementById("query").value;
      if (!query) return;

      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<div class="msg user"><b>You:</b> ${query}</div>`;

      const response = await fetch("/rag", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: query })
      });
      const data = await response.json();
      chatbox.innerHTML += `<div class="msg bot"><b>Bot:</b> ${data.answer}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;
      document.getElementById("query").value = "";
    }
  </script>
</body>
</html>
